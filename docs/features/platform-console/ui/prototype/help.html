<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帮助中心 — 平台控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page" style="align-items: flex-start; padding-top: 12vh;">
    <div class="auth-card" style="max-width: 560px;">
      <div class="auth-brand" style="align-items: flex-start; text-align: left;">
        <h1 style="font-size: 24px; font-weight: 700;">帮助中心</h1>
        <p class="text-sm text-muted">站内路由 /help 占位页 · v1 帮助入口统一指向本页</p>
      </div>
      <div class="stack-6">
        <div class="alert alert-neutral"><span aria-hidden="true">i</span><span>本页为原型占位页：正式环境中此处将提供运维支持页内容（登录问题、MFA 重置、Passkey 恢复等）。</span></div>
        <section class="card">
          <div class="card-title" style="margin-bottom: 12px;">常见问题</div>
          <ul class="text-sm" style="display: flex; flex-direction: column; gap: 10px; list-style: disc; padding-left: 20px; color: var(--text-primary);">
            <li>登录提示「用户名或密码错误」：请确认账号与密码，或改用其他已启用的登录方式（LDAP / Passkey）。</li>
            <li>尝试次数过多被锁定：请等待锁定期结束，或联系平台管理员解锁。</li>
            <li>Passkey 无法使用：当前浏览器不支持时请改用密码或 LDAP 登录。</li>
            <li>登录后提示「无所属租户」：请联系平台管理员将你加入对应租户。</li>
          </ul>
        </section>
        <div class="row-16">
          <a class="btn btn-outline" href="login.html">返回登录页</a>
          <a class="btn btn-ghost" href="index.html">返回原型导航</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
