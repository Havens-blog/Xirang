  <main class="container page">
    <!-- 页头：返回 + 角色名 + 保存 -->
    <section class="page-header">
      <div class="row-16">
        <a class="btn btn-ghost" href="roles.html">← 返回角色列表</a>
        <div class="page-title">
          <h2>运维管理员</h2>
          <p class="text-muted">角色详情 / 绑定 · ID: role-5c81bb72 · 当前绑定 5 个策略、12 个用户</p>
        </div>
      </div>
      <button type="button" class="btn btn-default" id="saveBtn">保存</button>
    </section>

    <div class="org-layout" style="grid-template-columns: 2fr 3fr;">
      <!-- 左：基本信息 + 策略绑定多选 -->
      <section class="stack-6">
        <div class="card" id="basicCard">
          <div class="card-header"><span class="card-title">基本信息</span></div>
          <div id="basicSkeleton" hidden>
            <div class="skeleton skeleton-text w-60"></div>
            <div class="skeleton skeleton-text w-40"></div>
          </div>
          <div id="basicBody" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="field">
              <label for="rdName" class="required">角色名</label>
              <input class="input" type="text" id="rdName" value="运维管理员" maxlength="64" aria-describedby="rdNameError">
              <span class="field-error" id="rdNameError" role="alert"></span>
            </div>
            <div class="field">
              <label for="rdTenant" class="required">所属租户</label>
              <select class="select" id="rdTenant" disabled>
                <option selected>生产租户</option>
              </select>
              <span class="field-hint">所属租户创建后不可变更</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <span class="card-title">策略绑定</span>
              <p class="text-sm text-muted" style="margin-top: 2px;">租户管理员仅可从可绑定策略列表中选择，无策略定义入口</p>
            </div>
            <span class="badge badge-secondary" id="policyCount">已选 5</span>
          </div>
          <input class="input" type="search" id="policySearch" placeholder="搜索策略名…" style="margin-bottom: 8px;" aria-label="搜索策略">
          <div class="pick-list" id="policyList"></div>
        </div>
      </section>

      <!-- 右：用户绑定多选（支持搜索） -->
      <section class="card" style="align-self: stretch;">
        <div class="card-header">
          <div>
            <span class="card-title">用户绑定</span>
            <p class="text-sm text-muted" style="margin-top: 2px;">支持按用户名搜索；保存后用户即时获得该角色权限</p>
          </div>
          <span class="badge badge-secondary" id="userCount">已选 12</span>
        </div>
        <input class="input" type="search" id="userSearch" placeholder="搜索用户名…" style="margin-bottom: 8px;" aria-label="搜索用户">
        <div class="pick-list" id="userPickList" style="max-height: 420px;"></div>
        <div class="card-footer" style="justify-content: space-between;">
          <span class="text-xs text-muted">共 12 个用户绑定该角色</span>
          <button type="button" class="btn btn-outline btn-sm" id="clearUsers">清空选择</button>
        </div>
      </section>
    </div>

  <script src="app.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };

      /* ---------- 数据 mock ---------- */
      var ALL_POLICIES = [
        { name: 'p-ec2-full-control', desc: '云主机完整操作', bound: true },
        { name: 'p-oss-readonly', desc: '对象存储只读', bound: true },
        { name: 'p-slb-manage', desc: '负载均衡管理', bound: true },
        { name: 'p-rds-backup', desc: '数据库备份与恢复', bound: true },
        { name: 'p-cert-manage', desc: 'SSL 证书管理', bound: true },
        { name: 'p-vpc-readonly', desc: '专有网络只读', bound: false },
        { name: 'p-cdn-purge', desc: 'CDN 缓存刷新', bound: false },
        { name: 'p-log-query', desc: '日志查询导出', bound: false }
      ];
      var ALL_USERS = [
        { username: 'zhangsan', bound: true }, { username: 'wangwu', bound: true },
        { username: 'zhaoliu', bound: true }, { username: 'qianyi', bound: true },
        { username: 'liuer', bound: true }, { username: 'sunsi', bound: true },
        { username: 'lisi', bound: false }, { username: 'sunqi', bound: false },
        { username: 'zhouba', bound: false }, { username: 'wujiu', bound: false },
        { username: 'zhengshi', bound: false }, { username: 'zhaoer', bound: false }
      ];

      function renderPolicies() {
        var kw = $('policySearch').value.trim();
        var list = ALL_POLICIES.filter(function (p) { return !kw || p.name.indexOf(kw) !== -1; });
        $('policyList').innerHTML = list.length ? list.map(function (p) {
          return '<label class="checkbox-row"><input type="checkbox" data-policy="' + p.name + '"' + (p.bound ? ' checked' : '') + '>' +
            '<span class="mono text-sm">' + p.name + '</span><span class="text-xs text-muted spacer" style="text-align: right;">' + p.desc + '</span></label>';
        }).join('') : '<div class="text-sm text-muted" style="padding: 16px; text-align: center;">无匹配策略</div>';
        updateCounts();
      }
      function renderUsers() {
        var kw = $('userSearch').value.trim();
        var list = ALL_USERS.filter(function (u) { return !kw || u.username.indexOf(kw) !== -1; });
        $('userPickList').innerHTML = list.length ? list.map(function (u) {
          return '<label class="checkbox-row"><input type="checkbox" data-user="' + u.username + '"' + (u.bound ? ' checked' : '') + '>' +
            '<span class="mono text-sm">' + u.username + '</span></label>';
        }).join('') : '<div class="text-sm text-muted" style="padding: 16px; text-align: center;">无匹配用户</div>';
        updateCounts();
      }
      function updateCounts() {
        var pc = $('policyList').querySelectorAll('input:checked').length;
        var uc = ALL_USERS.filter(function (u) { return u.bound; }).length;
        $('policyCount').textContent = '已选 ' + pc;
        $('userCount').textContent = '已选 ' + uc;
      }

      $('policySearch').addEventListener('input', renderPolicies);
      $('userSearch').addEventListener('input', renderUsers);
      $('policyList').addEventListener('change', function (e) {
        var cb = e.target.closest('[data-policy]');
        if (!cb) return;
        var p = ALL_POLICIES.find(function (x) { return x.name === cb.getAttribute('data-policy'); });
        p.bound = cb.checked;
        updateCounts();
      });
      $('userPickList').addEventListener('change', function (e) {
        var cb = e.target.closest('[data-user]');
        if (!cb) return;
        var u = ALL_USERS.find(function (x) { return x.username === cb.getAttribute('data-user'); });
        u.bound = cb.checked;
        updateCounts();
      });
      $('clearUsers').addEventListener('click', function () {
        ALL_USERS.forEach(function (u) { u.bound = false; });
        renderUsers();
        App.toast('已清空用户绑定选择（保存后生效）', 'warning');
      });

      /* ---------- 保存：成功后返回 /roles ---------- */
      $('saveBtn').addEventListener('click', function () {
        var name = $('rdName').value.trim();
        var errEl = $('rdNameError');
        errEl.textContent = '';
        if (!name) {
          $('rdName').classList.add('is-invalid');
          errEl.textContent = '角色名为必填项（1–64 字符）';
          return;
        }
        var btn = $('saveBtn');
        btn.classList.add('btn-loading');
        setTimeout(function () {
          btn.classList.remove('btn-loading');
          App.toast('角色「' + name + '」已保存，正在返回角色列表', 'success');
          setTimeout(function () { location.href = 'roles.html'; }, 900);
        }, 600);
      });

      renderPolicies();
      renderUsers();

      App.initDemo(function (state) {
        if (state === 'loading') {
          $('basicBody').hidden = true;
          $('basicSkeleton').hidden = false;
          return;
        }
        $('basicBody').hidden = false;
        $('basicSkeleton').hidden = true;
        if (state === 'error') App.toast('身份服务暂不可用，请稍后重试', 'error');
        if (state === 'empty') {
          App.toast('该角色已被删除，返回角色列表', 'warning');
          setTimeout(function () { location.href = 'roles.html'; }, 900);
        }
      });
    })();
  </script>
