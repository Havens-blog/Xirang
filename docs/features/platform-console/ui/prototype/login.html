<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 平台控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card" id="authCard">
      <!-- CardHeader：产品名 + Logo 位 -->
      <div class="auth-brand">
        <span class="brand-mark">PC</span>
        <div>
          <h1 style="font-size: 22px; font-weight: 700;">平台控制台</h1>
          <p class="text-sm text-muted" style="margin-top: 4px;">统一身份与权限管理入口</p>
        </div>
      </div>

      <!-- 错误条（统一中性错误条，role=alert） -->
      <div class="alert alert-error" id="authError" role="alert" hidden>
        <span aria-hidden="true">✕</span>
        <span id="authErrorText"></span>
      </div>

      <!-- 锁定提示（账号级 / 方式级，倒计时 aria-live） -->
      <div class="alert alert-warning" id="lockBanner" role="alert" hidden>
        <span aria-hidden="true">⏸</span>
        <span>
          <span id="lockText">尝试次数过多，账号已锁定，剩余 15 分钟</span>
          <span class="alert-sub" id="lockSub" hidden>可改用其他已启用的登录方式</span>
        </span>
      </div>

      <!-- Passkey 不可用提示（WebAuthn 不可用时渲染于卡片内） -->
      <div class="alert alert-neutral" id="passkeyNotice" hidden>
        <span aria-hidden="true">i</span>
        <span>当前浏览器不支持 Passkey，请改用密码或 LDAP 登录</span>
      </div>

      <!-- 登录表单区 -->
      <div id="loginArea" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- 登录方式 Tab -->
        <div class="tabs" role="tablist" aria-label="登录方式">
          <button type="button" class="tab-btn active" id="tab-password" role="tab" aria-selected="true" aria-controls="panel-password">密码</button>
          <button type="button" class="tab-btn" id="tab-ldap" role="tab" aria-selected="false" aria-controls="panel-ldap">LDAP</button>
          <button type="button" class="tab-btn" id="tab-passkey" role="tab" aria-selected="false" aria-controls="panel-passkey">Passkey</button>
        </div>

        <!-- 密码登录 -->
        <form class="tab-panel" id="panel-password" role="tabpanel" aria-labelledby="tab-password" novalidate style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field">
            <label for="username" class="required">用户名</label>
            <input class="input" type="text" id="username" name="username" autocomplete="username" placeholder="请输入用户名">
          </div>
          <div class="field">
            <label for="password" class="required">密码</label>
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码">
          </div>
          <!-- MFA 挑战（追加 6 位验证码） -->
          <div class="field" id="mfaField" hidden>
            <label for="mfa_token" class="required">动态验证码（MFA）</label>
            <input class="input mono" type="text" id="mfa_token" name="mfa_token" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" aria-describedby="mfaHint">
            <span class="field-hint" id="mfaHint">请输入认证器 App 中展示的 6 位动态码</span>
          </div>
          <button type="submit" class="btn btn-default" id="loginBtn">登 录</button>
        </form>

        <!-- LDAP 登录 -->
        <form class="tab-panel" id="panel-ldap" role="tabpanel" aria-labelledby="tab-ldap" hidden novalidate style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field">
            <label for="ldap_user" class="required">域账号</label>
            <input class="input" type="text" id="ldap_user" placeholder="例如 CORP\zhangsan">
          </div>
          <div class="field">
            <label for="ldap_password" class="required">域密码</label>
            <input class="input" type="password" id="ldap_password" autocomplete="current-password" placeholder="请输入域密码">
          </div>
          <button type="submit" class="btn btn-default">登 录</button>
        </form>

        <!-- Passkey 登录 -->
        <div class="tab-panel" id="panel-passkey" role="tabpanel" aria-labelledby="tab-passkey" hidden style="display: flex; flex-direction: column; gap: 16px;">
          <div class="state-block" style="padding: 24px;">
            <div class="state-icon" aria-hidden="true">🔑</div>
            <div class="state-title">使用已注册的 Passkey 验证</div>
            <p class="state-desc">点击下方按钮后，按浏览器提示完成指纹 / 面容 / 安全密钥验证</p>
          </div>
          <button type="button" class="btn btn-default" id="passkeyBtn">使用 Passkey 登录</button>
        </div>
      </div>

      <!-- 强制改密态（E1 首次登录） -->
      <form id="changePwdArea" hidden novalidate style="display: flex; flex-direction: column; gap: 16px;">
        <div class="alert alert-neutral">初始密码仅展示一次，首次登录须修改密码后方可进入系统</div>
        <div class="field">
          <label for="new_password" class="required">新密码</label>
          <input class="input" type="password" id="new_password" placeholder="至少 8 位，含字母与数字">
          <span class="field-error" id="new_password-error"></span>
        </div>
        <div class="field">
          <label for="confirm_password" class="required">确认新密码</label>
          <input class="input" type="password" id="confirm_password" placeholder="请再次输入新密码">
          <span class="field-error" id="confirm_password-error"></span>
        </div>
        <button type="submit" class="btn btn-default" id="changePwdBtn">确认修改</button>
      </form>

      <!-- CardFooter：帮助入口（站内 /help 占位） -->
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-base); padding-top: 16px;">
        <a class="text-sm text-muted" href="help.html" style="text-decoration: underline;">遇到登录问题？查看帮助</a>
        <span class="text-xs text-muted">eiam 统一认证</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };

      /* ---------- 文案契约（逐字，不得改写） ---------- */
      var MSG = {
        invalidCredentials: '用户名或密码错误',
        mfaInvalid: '验证码错误，请重新输入',
        accountLocked: '尝试次数过多，账号已锁定，剩余 {X} 分钟',
        emptyCredentials: '请输入用户名和密码',
        passkeyUnsupported: '当前浏览器不支持 Passkey，请改用密码或 LDAP 登录',
        firstLoginChange: '首次登录请修改密码'
      };
      var LOCK_MINUTES = 15;
      var MAX_MFA_FAILS = 5;

      var state = {
        mfaRequired: false,
        mfaFails: 0,
        lockRemain: LOCK_MINUTES,
        lockTimer: null,
        lockLevel: null /* 'account' | 'method' */
      };

      /* ---------- 错误条 ---------- */
      function showError(text) {
        $('authErrorText').textContent = text;
        $('authError').hidden = false;
      }
      function clearError() { $('authError').hidden = true; }

      /* ---------- 锁定态（账号级 / 方式级） ---------- */
      function showLock(level) {
        clearError();
        state.lockLevel = level;
        state.lockRemain = LOCK_MINUTES;
        $('lockText').textContent = MSG.accountLocked.replace('{X}', state.lockRemain);
        /* 方式级锁定：可改用其他已启用的登录方式（副行 + 其余 Tab 可用）；
           账号级锁定：全部登录方式禁用，无该副行 */
        $('lockSub').hidden = level !== 'method';
        $('lockBanner').hidden = false;
        var tabs = ['tab-password', 'tab-ldap', 'tab-passkey'];
        tabs.forEach(function (id) {
          $(id).disabled = level === 'account';
        });
        if (level === 'account') {
          $('loginArea').querySelectorAll('input, button').forEach(function (el) {
            if (!el.id || el.id.indexOf('tab-') !== 0) el.disabled = true;
          });
        }
        clearInterval(state.lockTimer);
        state.lockTimer = setInterval(function () {
          state.lockRemain = Math.max(0, state.lockRemain - 1);
          $('lockText').textContent = MSG.accountLocked.replace('{X}', state.lockRemain);
          if (state.lockRemain === 0) resetLock();
        }, 60000);
      }
      function resetLock() {
        clearInterval(state.lockTimer);
        state.lockTimer = null;
        state.lockLevel = null;
        $('lockBanner').hidden = true;
        $('loginArea').querySelectorAll('input, button').forEach(function (el) { el.disabled = false; });
        applyPasskeyUnavailable(state.passkeyUnsupported === true);
      }

      /* ---------- Passkey 不可用（E8）：隐藏 Passkey 入口 + 卡片 notice ---------- */
      function applyPasskeyUnavailable(unsupported) {
        state.passkeyUnsupported = unsupported;
        $('passkeyNotice').hidden = !unsupported;
        $('tab-passkey').style.display = unsupported ? 'none' : '';
        if (unsupported && $('tab-passkey').classList.contains('active')) switchTab('password');
      }

      /* ---------- Tab 切换（Tab 顺序：登录方式 Tab → 表单字段 → 提交按钮） ---------- */
      var TABS = ['password', 'ldap', 'passkey'];
      function switchTab(name) {
        TABS.forEach(function (t) {
          var tab = $('tab-' + t);
          var panel = $('panel-' + t);
          var on = t === name;
          tab.classList.toggle('active', on);
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
          panel.hidden = !on;
          if (on) {
            panel.style.display = 'flex';
          } else {
            panel.style.display = '';
          }
        });
        clearError();
      }
      TABS.forEach(function (t) {
        $('tab-' + t).addEventListener('click', function () {
          if (state.lockLevel === 'account') return;
          if (state.lockLevel === 'method' && t === state.lockedMethod) {
            App.toast('该登录方式已被锁定，请改用其他方式', 'warning');
            return;
          }
          switchTab(t);
        });
      });
      state.lockedMethod = null;

      /* ---------- 密码登录提交 ---------- */
      $('panel-password').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();
        var username = $('username').value.trim();
        var password = $('password').value;
        if (!username || !password) { showError(MSG.emptyCredentials); return; }
        var btn = $('loginBtn');
        btn.classList.add('btn-loading');
        setTimeout(function () {
          btn.classList.remove('btn-loading');
          if (password === 'wrong') { showError(MSG.invalidCredentials); return; }
          if (!state.mfaRequired) {
            state.mfaRequired = true;
            $('mfaField').hidden = false;
            $('mfa_token').focus();
            return;
          }
          var code = $('mfa_token').value.trim();
          if (code !== '246810') {
            state.mfaFails += 1;
            if (state.mfaFails >= MAX_MFA_FAILS) {
              state.mfaRequired = false;
              showLock('account');
            } else {
              showError(MSG.mfaInvalid);
            }
            return;
          }
          App.toast('登录成功，正在进入…', 'success');
          setTimeout(function () { location.href = 'tenant-select.html'; }, 700);
        }, 600);
      });

      /* ---------- LDAP 提交 ---------- */
      $('panel-ldap').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();
        var user = $('ldap_user').value.trim();
        var pwd = $('ldap_password').value;
        if (!user || !pwd) { showError(MSG.emptyCredentials); return; }
        if (pwd === 'wrong') { showError(MSG.invalidCredentials); return; }
        App.toast('LDAP 认证成功，正在进入…', 'success');
        setTimeout(function () { location.href = 'tenant-select.html'; }, 700);
      });

      /* ---------- Passkey ---------- */
      $('passkeyBtn').addEventListener('click', function () {
        App.toast('Passkey 验证成功，正在进入…', 'success');
        setTimeout(function () { location.href = 'tenant-select.html'; }, 700);
      });

      /* ---------- 强制改密（E1） ---------- */
      $('changePwdArea').addEventListener('submit', function (e) {
        e.preventDefault();
        var np = $('new_password').value;
        var cp = $('confirm_password').value;
        var ok = true;
        $('new_password-error').textContent = '';
        $('confirm_password-error').textContent = '';
        if (!np || np.length < 8 || !/[a-zA-Z]/.test(np) || !/\d/.test(np)) {
          $('new_password-error').textContent = '新密码至少 8 位，且同时包含字母与数字';
          $('new_password').classList.add('is-invalid');
          ok = false;
        } else { $('new_password').classList.remove('is-invalid'); }
        if (cp !== np || !cp) {
          $('confirm_password-error').textContent = '两次输入的密码不一致';
          $('confirm_password').classList.add('is-invalid');
          ok = false;
        } else { $('confirm_password').classList.remove('is-invalid'); }
        if (!ok) return;
        var btn = $('changePwdBtn');
        btn.classList.add('btn-loading');
        setTimeout(function () {
          btn.classList.remove('btn-loading');
          App.toast('密码修改成功，请使用新密码重新登录', 'success');
          setTimeout(function () { location.href = 'tenant-select.html'; }, 900);
        }, 600);
      });

      /* ---------- 原型状态演示（登录页专属状态） ---------- */
      var demo = document.createElement('div');
      demo.className = 'demo-panel';
      demo.innerHTML =
        '<button type="button" class="demo-panel-toggle">登录态演示</button>' +
        '<div class="demo-panel-body">' +
        '  <div class="demo-panel-group">' +
        '    <button type="button" class="demo-btn current" data-d="default">默认</button>' +
        '    <button type="button" class="demo-btn" data-d="mfa">MFA 挑战</button>' +
        '    <button type="button" class="demo-btn" data-d="change">强制改密</button>' +
        '  </div>' +
        '  <div class="demo-panel-group">' +
        '    <button type="button" class="demo-btn" data-d="lock-account">锁定·账号级</button>' +
        '    <button type="button" class="demo-btn" data-d="lock-method">锁定·方式级</button>' +
        '    <button type="button" class="demo-btn" data-d="nopasskey">Passkey 不可用</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(demo);
      demo.querySelector('.demo-panel-toggle').addEventListener('click', function () {
        demo.classList.toggle('open');
      });
      demo.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-d]');
        if (!btn) return;
        var d = btn.getAttribute('data-d');
        demo.querySelectorAll('[data-d]').forEach(function (b) { b.classList.remove('current'); });
        btn.classList.add('current');
        resetLock();
        state.mfaRequired = false;
        state.mfaFails = 0;
        $('mfaField').hidden = true;
        $('loginArea').hidden = false;
        $('changePwdArea').hidden = true;
        $('loginArea').style.display = 'flex';
        applyPasskeyUnavailable(false);
        clearError();
        if (d === 'mfa') {
          switchTab('password');
          state.mfaRequired = true;
          $('mfaField').hidden = false;
          App.toast('已进入 MFA 挑战态：演示验证码 246810，输错 5 次触发账号级锁定', 'success');
        } else if (d === 'change') {
          $('loginArea').style.display = 'none';
          $('changePwdArea').hidden = false;
        } else if (d === 'lock-account') {
          switchTab('password');
          showLock('account');
        } else if (d === 'lock-method') {
          switchTab('passkey');
          state.lockedMethod = 'passkey';
          showLock('method');
        } else if (d === 'nopasskey') {
          applyPasskeyUnavailable(true);
        }
      });
    })();
  </script>
</body>
</html>
