  <main class="container page">
    <section class="page-header">
      <div class="page-title">
        <h2>角色管理</h2>
        <p class="text-muted">绑定用户数同时作为删除校验来源 · 行内「编辑」进入角色详情/绑定子页</p>
      </div>
      <button type="button" class="btn btn-default" data-modal-open="roleCreateModal">新增角色</button>
    </section>

    <section id="listLoading" hidden aria-busy="true" aria-label="角色列表加载中">
      <div class="table-scroll"><div class="card-inner-pad" style="padding: 16px;">
        <div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>
      </div></div>
    </section>
    <section id="listEmpty" hidden>
      <div class="table-scroll"><div class="state-block">
        <div class="state-icon" aria-hidden="true">∅</div>
        <div class="state-title">暂无角色</div>
        <p class="state-desc">当前租户尚未创建任何角色，点击「新增角色」开始</p>
        <button type="button" class="btn btn-outline" data-modal-open="roleCreateModal">新增角色</button>
      </div></div>
    </section>
    <section id="listError" hidden>
      <div class="table-scroll"><div class="state-block">
        <div class="state-icon" aria-hidden="true">✕</div>
        <div class="state-title">身份服务暂不可用，请稍后重试</div>
        <p class="state-desc">角色列表查询失败（eiam 接口超时）</p>
        <button type="button" class="btn btn-outline" id="retryBtn">重试</button>
      </div></div>
    </section>

    <section id="listBody">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>角色名</th><th>所属租户</th><th>绑定策略数</th><th>绑定用户数</th><th style="text-align: right;">操作</th></tr>
          </thead>
          <tbody id="roleTbody"></tbody>
        </table>
      </div>
    </section>
  </main>
    </div>
  </div>

  <!-- 新增角色 Dialog -->
  <div class="modal-backdrop" id="roleCreateModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="roleCreateTitle">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="roleCreateTitle">新增角色</div>
          <p class="modal-desc">角色名 1–64 字符、租户内唯一；输入已存在的名称可演示冲突提示</p>
        </div>
        <button type="button" class="modal-close" data-modal-close aria-label="关闭">✕</button>
      </div>
      <form id="roleForm" novalidate>
        <div class="modal-body">
          <div class="field">
            <label for="roleName" class="required">角色名</label>
            <input class="input" type="text" id="roleName" maxlength="64" placeholder="例如：网络管理员" aria-describedby="roleNameError">
            <span class="field-error" id="roleNameError" role="alert"></span>
          </div>
          <div class="field">
            <label for="roleTenant" class="required">所属租户</label>
            <select class="select" id="roleTenant">
              <option selected>生产租户</option><option>预发租户</option><option>测试租户</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>取消</button>
          <button type="submit" class="btn btn-default">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };

      var DATASET = [
        { name: '运维管理员', tenant: '生产租户', policies: 5, users: 12 },
        { name: '租户管理员', tenant: '生产租户', policies: 3, users: 2 },
        { name: '只读审计员', tenant: '生产租户', policies: 8, users: 34 },
        { name: '普通用户', tenant: '生产租户', policies: 1, users: 208 },
        { name: '发布操作员', tenant: '预发租户', policies: 2, users: 0 }
      ];

      function render() {
        $('roleTbody').innerHTML = DATASET.map(function (r, i) {
          return '<tr>' +
            '<td class="font-medium">' + r.name + '</td>' +
            '<td>' + r.tenant + '</td>' +
            '<td class="mono">' + r.policies + '</td>' +
            '<td class="mono">' + r.users + '</td>' +
            '<td><div class="cell-actions">' +
            '  <a class="btn-link" href="role-detail.html" aria-label="编辑角色 ' + r.name + '">编辑</a>' +
            '  <button type="button" class="btn-link danger" data-del="' + i + '">删除</button>' +
            '</div></td></tr>';
        }).join('');
      }

      function show(mode) {
        $('listLoading').hidden = mode !== 'loading';
        $('listEmpty').hidden = mode !== 'empty';
        $('listError').hidden = mode !== 'error';
        $('listBody').hidden = mode !== 'populated';
      }
      function fetchList(force) {
        show('loading');
        setTimeout(function () { show(force || 'populated'); render(); }, 700);
      }

      /* ---------- 新增（名称唯一冲突：validation.name_exists） ---------- */
      $('roleForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = $('roleName').value.trim();
        var errEl = $('roleNameError');
        errEl.textContent = '';
        $('roleName').classList.remove('is-invalid');
        if (!name) {
          $('roleName').classList.add('is-invalid');
          errEl.textContent = '角色名为必填项（1–64 字符）';
          return;
        }
        var tenant = $('roleTenant').value;
        if (DATASET.some(function (r) { return r.name === name && r.tenant === tenant; })) {
          $('roleName').classList.add('is-invalid');
          errEl.textContent = '名称已存在：' + name;
          return;
        }
        DATASET.push({ name: name, tenant: tenant, policies: 0, users: 0 });
        App.closeModal('roleCreateModal');
        e.target.reset();
        App.toast('角色「' + name + '」已创建，列表已刷新', 'success');
        fetchList('populated');
      });

      /* ---------- 删除：校验无用户绑定，被拒显示绑定数 ---------- */
      $('roleTbody').addEventListener('click', function (e) {
        var del = e.target.closest('[data-del]');
        if (!del) return;
        var r = DATASET[parseInt(del.getAttribute('data-del'), 10)];
        if (r.users > 0) {
          /* 契约逐字：无法删除：该角色已绑定 {n} 个用户 */
          App.toast('无法删除：该角色已绑定 ' + r.users + ' 个用户', 'error');
          return;
        }
        DATASET = DATASET.filter(function (x) { return x !== r; });
        App.toast('角色「' + r.name + '」已删除', 'success');
        fetchList('populated');
      });

      $('retryBtn').addEventListener('click', function () { fetchList('populated'); });

      App.initDemo(function (state) {
        if (state === 'loading') { show('loading'); return; }
        fetchList(state === 'populated' ? 'populated' : state);
      });
      fetchList('populated');
    })();
  </script>
