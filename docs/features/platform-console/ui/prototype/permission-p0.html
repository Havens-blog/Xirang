<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限控制 P0 原型 · 平台控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ============ 页面专用样式（权限 P0 原型） ============ */
    /* 角色切换芯片组 */
    .role-switch { display: flex; gap: 4px; background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: 3px; }
    .role-chip { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-tertiary); white-space: nowrap; transition: all 150ms ease; }
    .role-chip:hover { color: var(--text-primary); }
    .role-chip.active { background: var(--bg-surface); color: var(--accent-blue); font-weight: 600; box-shadow: var(--shadow-sm); }
    .perm-count { font-size: 12px; color: var(--text-tertiary); font-family: var(--font-mono); white-space: nowrap; }

    /* 菜单项上的权限码标注 */
    .menu-item .menu-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .menu-code { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); padding: 1px 6px; border-radius: 4px; flex: none; }
    .menu-item.active .menu-code { color: var(--accent-blue); border-color: color-mix(in srgb, var(--accent-blue) 30%, transparent); }
    .menu-tag-sys { font-family: var(--font-mono); font-size: 9px; color: var(--accent-yellow); border: 1px solid color-mix(in srgb, var(--accent-yellow) 35%, transparent); padding: 0 4px; border-radius: 4px; flex: none; }

    /* 权限码标注条（页面级） */
    .code-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .code-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border-base); color: var(--text-tertiary); background: transparent; }
    .code-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); }
    .code-chip.on { color: var(--accent-green); border-color: color-mix(in srgb, var(--accent-green) 35%, transparent); }
    .code-chip.on .dot { background: var(--accent-green); box-shadow: 0 0 6px color-mix(in srgb, var(--accent-green) 70%, transparent); }
    .code-chip.hard { color: var(--accent-yellow); border-color: color-mix(in srgb, var(--accent-yellow) 35%, transparent); }
    .code-chip.hard .dot { background: var(--accent-yellow); }

    /* 只读横幅 */
    .readonly-banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-control); background: color-mix(in srgb, var(--accent-blue) 8%, transparent); border: 1px solid color-mix(in srgb, var(--accent-blue) 25%, transparent); color: var(--text-regular); font-size: 13px; }
    .readonly-banner .ico { color: var(--accent-blue); }

    /* 表格 & 行操作 */
    .table-scroll-x { overflow-x: auto; }
    .data-table th { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--table-border); background: var(--table-header-bg); white-space: nowrap; }
    .data-table td { padding: 12px; font-size: 14px; color: var(--text-regular); border-bottom: 1px solid var(--table-border); white-space: nowrap; }
    .data-table tr:hover td { background: var(--table-row-hover); }
    .row-actions { display: flex; gap: 8px; }
    .link-btn { font-size: 13px; color: var(--accent-blue); background: none; border: none; cursor: pointer; padding: 0; }
    .link-btn:hover { text-decoration: underline; }
    .link-btn.danger { color: var(--color-danger); }
    .link-btn.muted { color: var(--text-secondary); }

    /* 权限矩阵 */
    .matrix-table th, .matrix-table td { text-align: center; }
    .matrix-table th:first-child, .matrix-table td:first-child { text-align: left; }
    .mk { font-family: var(--font-mono); font-size: 12px; color: var(--accent-cyan); }
    .mk-ok { color: var(--accent-green); font-weight: 700; }
    .mk-no { color: var(--text-tertiary); }
    .mod-row td { background: var(--table-header-bg); font-weight: 600; color: var(--text-secondary); font-size: 13px; }
    .tag-p1 { font-family: var(--font-mono); font-size: 11px; color: var(--accent-yellow); border: 1px solid color-mix(in srgb, var(--accent-yellow) 40%, transparent); border-radius: 4px; padding: 0 6px; margin-left: 6px; }

    /* 403 页 */
    .forbidden-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 72px 24px; text-align: center; }
    .forbidden-icon { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent-yellow) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent-yellow) 30%, transparent); color: var(--accent-yellow); }
    .forbidden-wrap h2 { font-size: 22px; }
    .forbidden-code { font-family: var(--font-mono); font-size: 13px; padding: 4px 12px; border-radius: 6px; background: var(--bg-hover); border: 1px solid var(--border-base); color: var(--accent-yellow); }

    /* 数据流图 */
    .flow-svg-wrap { overflow-x: auto; padding: 8px 0; }
    .flow-svg { min-width: 900px; }

    /* 对比卡 */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 1023px) { .compare-grid { grid-template-columns: 1fr; } }
    .compare-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 16px; background: transparent; }
    .compare-card.before { border-color: color-mix(in srgb, var(--accent-red) 30%, transparent); }
    .compare-card.after { border-color: color-mix(in srgb, var(--accent-green) 30%, transparent); }
    .compare-card h4 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .compare-card ul { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--text-secondary); }
    .compare-card li { display: flex; gap: 8px; align-items: flex-start; }
    .compare-card .m { color: var(--text-tertiary); flex: none; }

    /* P0 改造点 */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }
    .todo-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-control); background: var(--bg-hover-transparent, rgba(255,255,255,0.02)); border: 1px solid var(--border-subtle); }
    .todo-num { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-primary); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .todo-body b { color: var(--text-primary); font-weight: 600; }
    .todo-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .todo-body code { font-size: 12px; color: var(--accent-cyan); }

    /* 工作台占位 */
    .wb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
    .wb-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 18px; background: var(--bg-surface); }
    .wb-card b { display: block; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
    .wb-card span { font-size: 12px; color: var(--text-secondary); }
    .wb-card .forbidden-mini { margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  </style>
</head>
<body>
  <div class="layout" id="app">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" fill="#7170ff"/><rect x="13" y="4" width="7" height="7" fill="#5e6ad2"/><rect x="4" y="13" width="7" height="7" fill="#5e6ad2"/><rect x="13" y="13" width="7" height="7" fill="#8b5cf6"/></svg>
        <span class="logo-text">Platform</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"><!-- 由 JS 按角色渲染 --></nav>
    </aside>

    <!-- ============ 主区 ============ -->
    <div class="main-area">
      <header class="app-header">
        <div class="breadcrumb">
          <a href="#" onclick="return false;">平台控制台</a>
          <span class="crumb-sep">/</span>
          <span class="crumb-current" id="crumb-current">工作台</span>
        </div>
        <div class="header-actions">
          <!-- 角色上下文切换（原型演示控件） -->
          <div class="role-switch" id="role-switch" role="tablist" aria-label="角色上下文切换"></div>
          <span class="perm-count" id="perm-count" title="当前角色持有的 iam:* 能力码数量（模拟数据）"></span>
          <button class="tenant-trigger" type="button">
            <span class="dot"></span><span class="label">系统租户 · jlcops</span>
          </button>
          <button class="app-switcher" type="button" onclick="return false;"><span class="grid-dot"><i></i><i></i><i></i><i></i></span>应用切换</button>
          <button class="avatar-btn" type="button" title="当前用户">HN</button>
          <button class="toggle-btn" id="theme-toggle" type="button" aria-label="切换明暗主题">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <main class="container page" id="main-area"><!-- 视图由 JS 渲染 --></main>
    </div>
  </div>

  <script>
    /* ==================================================================
       权限控制 P0 原型 · 模拟数据与交互
       数据源口径：docs/features/platform-console/parity-checklist.md §6.2
       （eiam 89 条 L2 端点能力码词表；前端三层裁剪仅体验层，安全边界在服务端 403）
       ================================================================== */

    // ---- 四角色授权码集合（模拟 profile.permissions，实际取自 eiam）----
    const ROLE_CODES = {
      platform_admin: [
        'iam:user:view','iam:user:add','iam:user:edit','iam:user:delete','iam:user:batch_delete','iam:user:manage_identity',
        'iam:department:view','iam:department:add','iam:department:edit','iam:department:delete','iam:department:members','iam:department:assign',
        'iam:tenant:view','iam:tenant:add','iam:tenant:edit','iam:tenant:delete','iam:tenant:members','iam:tenant:assign',
        'iam:identity_source:view','iam:identity_source:save','iam:identity_source:test','iam:identity_source:toggle','iam:identity_source:delete',
        'iam:role:view','iam:role:add','iam:role:edit','iam:role:delete','iam:role:batch_assign','iam:role:batch_unassign','iam:role:add_parent',
        'iam:permission:view_authorizations','iam:permission:search_subjects','iam:permission:manifest',
        'iam:policy:view','iam:policy:add','iam:policy:edit','iam:policy:delete','iam:policy:batch_attach','iam:policy:batch_detach',
        'iam:group:view','iam:invitation:view',
      ],
      tenant_admin: [
        'iam:user:view','iam:user:add','iam:user:edit',
        'iam:role:view','iam:role:batch_assign','iam:role:batch_unassign','iam:role:edit',
        'iam:permission:view_authorizations','iam:permission:search_subjects',
      ],
      readonly_audit: [
        'iam:user:view',
        'iam:department:view',
        'iam:identity_source:view',
        'iam:role:view',
        'iam:permission:view_authorizations',
      ],
      normal: ['cmdb:read'],
    };

    const ROLE_META = {
      platform_admin: { label: '平台管理员', desc: '全局治理 · 跨租户 · 策略定义' },
      tenant_admin:   { label: '租户管理员', desc: '本租户用户/角色/授权治理' },
      readonly_audit: { label: '只读审计',   desc: '只读查看 · 无增删改入口' },
      normal:         { label: '普通用户',   desc: '消费侧 · 仅工作台' },
    };

    // ---- 菜单定义（key/label/group/所需权限码/系统级标记/图标）----
    const ICONS = {
      home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
      org:'<rect x="3" y="14" width="6" height="7" rx="1"/><rect x="15" y="14" width="6" height="7" rx="1"/><rect x="9" y="4" width="6" height="7" rx="1"/><path d="M6 14V8m12 6V8M9 11V8m6 3V8"/>',
      tenant:'<path d="m12 2 8.5 4.9v9.8L12 21.6l-8.5-4.9V6.9L12 2z"/><path d="M12 8v13"/>',
      key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.8 12.2 8.5-8.5M15 6l3 3"/>',
      role:'<path d="M12 2 4 5v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V5l-8-3z"/><path d="m9 12 2 2 4-4"/>',
      auth:'<path d="M6 3h9l3 3v15H6V3z"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',
      policy:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',
    };
    const MENUS = [
      { key:'workbench', label:'工作台', group:'概览', code:null, sys:false, icon:'home', view:'workbench' },
      { key:'users', label:'用户管理', group:'身份治理', code:'iam:user:view', sys:false, icon:'user', view:'users' },
      { key:'organizations', label:'组织管理', group:'身份治理', code:'iam:department:view', sys:false, icon:'org', view:'organizations' },
      { key:'tenants', label:'租户管理', group:'身份治理', code:'iam:tenant:view', sys:true, icon:'tenant', view:'tenants' },
      { key:'identity-sources', label:'身份源管理', group:'身份治理', code:'iam:identity_source:view', sys:true, icon:'key', view:'identity-sources' },
      { key:'roles', label:'角色管理', group:'权限管理', code:'iam:role:view', sys:false, icon:'role', view:'roles' },
      { key:'authorizations', label:'授权管理', group:'权限管理', code:'iam:permission:view_authorizations', sys:false, icon:'auth', view:'authorizations' },
      { key:'policies', label:'策略管理', group:'权限管理', code:'iam:policy:view', sys:true, icon:'policy', view:'policies' },
    ];

    // ---- 状态 ----
    let currentRole = 'platform_admin';
    let currentView = 'workbench';

    const $ = (id) => document.getElementById(id);
    const has = (code) => ROLE_CODES[currentRole].includes(code);

    // ---- 角色切换芯片 ----
    function renderRoleSwitch() {
      const wrap = $('role-switch');
      wrap.innerHTML = '';
      Object.entries(ROLE_META).forEach(([key, meta]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'role-chip' + (key === currentRole ? ' active' : '');
        b.textContent = meta.label;
        b.title = meta.desc;
        b.setAttribute('role','tab');
        b.setAttribute('aria-selected', String(key === currentRole));
        b.onclick = () => { currentRole = key; renderAll(); };
        wrap.appendChild(b);
      });
      $('perm-count').textContent = `权限码 ${ROLE_CODES[currentRole].length} 项`;
    }

    // ---- 侧边栏渲染（菜单裁剪 = 按权限码，不是 isAdmin 二分）----
    function renderSidebar() {
      const nav = $('sidebar-nav');
      const groups = ['概览', '身份治理', '权限管理'];
      nav.innerHTML = groups.map((g) => {
        const items = MENUS.filter((m) => m.group === g && (m.code === null || has(m.code)));
        if (items.length === 0) return '';
        return `<div class="menu-group">
          <div class="group-title">${g}</div>
          ${items.map((m) => `
            <button class="menu-item ${currentView === m.view || (currentView === '403' && m.view === 'users') ? 'active' : ''}"
                    onclick="navTo('${m.view}')" title="${m.code ? '需要 ' + m.code : '无权限码要求（登录态即可）'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[m.icon]}</svg>
              <span class="menu-title">${m.label}</span>
              ${m.sys === true && m.code !== null && has(m.code) ? '<span class="menu-tag-sys">系统级</span>' : ''}
              ${m.code ? `<span class="menu-code">${m.code.split(':').slice(-1)[0]}</span>` : ''}
            </button>`).join('')}
        </div>`;
      }).join('');
      // 零可见菜单兜底提示（普通用户只有工作台）
      if (!MENUS.some((m) => m.group === '身份治理' && (m.code === null || has(m.code)))) {
        nav.innerHTML += `<div style="padding:8px 20px;font-size:12px;color:var(--text-tertiary);line-height:1.7;">身份治理 / 权限管理菜单已按权限码裁剪。<br>（${ROLE_META[currentRole].desc}）</div>`;
      }
    }

    // ---- 视图切换（含 403 模拟）----
    function navTo(view) {
      const menu = MENUS.find((m) => m.view === view);
      if (menu && menu.code !== null && !has(menu.code)) {
        // 模拟直输 URL：菜单已裁剪但 URL 仍可达 → 守卫 ③ 拦截 → 403 页（原地，不跳登录）
        currentView = '403';
        $('crumb-current').textContent = '403 · 无权访问';
        $('main-area').innerHTML = renderForbidden(menu);
        renderSidebar();
        return;
      }
      currentView = view;
      $('crumb-current').textContent = menu ? menu.label : '工作台';
      $('main-area').innerHTML = VIEW_RENDER[view] ? VIEW_RENDER[view]() : placeholderView(view);
      renderSidebar();
    }

    // ---- 权限码标注条（页面级：当前角色哪些码点亮）----
    function codeStrip(entries, extraNote) {
      return `<div class="code-strip">${entries.map(([code, label]) => {
        const on = has(code);
        return `<span class="code-chip ${on ? 'on' : ''}" title="所需权限码 ${code}${on ? ' · 当前角色已持有' : ' · 当前角色未持有（相应按钮已裁剪）'}"><span class="dot"></span>${label}</span>`;
      }).join('')}${extraNote || ''}</div>`;
    }

    // ---- 视图渲染们 ----
    const VIEW_RENDER = {};

    VIEW_RENDER.workbench = () => `
      <section class="page-header">
        <div class="page-title"><h2>工作台</h2>
          <p class="text-muted">欢迎回来，HN —— 当前以 <b>${ROLE_META[currentRole].label}</b> 身份（模拟）查看本原型</p>
        </div>
      </section>
      ${roleHint()}
      <section class="card">
        <div class="card-title">本原型演示什么（P0 权限控制）</div>
        <ul class="text-sm text-muted" style="display:flex;flex-direction:column;gap:8px;list-style:disc;padding-left:20px;line-height:1.7;">
          <li>顶部「角色切换」在 平台管理员 / 租户管理员 / 只读审计 / 普通用户 之间切换（模拟 profile.permissions 的 100+ 能力码）。</li>
          <li>侧边栏菜单 = 按 <code class="mono" style="font-size:12px;">iam:*:view</code> 权限码裁剪 —— 修复现状 <code class="mono" style="font-size:12px;">inferRole</code> 只有「管理员/非管理员」两档、tenant_admin 档不可达的问题。</li>
          <li>页面内按钮 = <code class="mono" style="font-size:12px;">v-can="'iam:user:add'"</code> 逐按钮裁剪；只读角色看不到任何增删改入口。</li>
          <li>点击左侧「权限码矩阵 / 数据流总览」进入 P0 设计详情；对无码角色点被裁剪的菜单 → 演示 403 原地页。</li>
          <li>左上「普通用户」身份下，可以点击侧边栏仅剩的工作台；身份治理菜单全部消失（与实际守卫链 ③ 同口径）。</li>
        </ul>
      </section>
      <section>
        <h3 style="font-size:16px;margin-bottom:2px;">P0 交付视图</h3>
        <div class="wb-grid">
          <div class="wb-card"><b>用户管理 · 按码裁剪</b><span>新增/编辑/删除/启停按钮随角色实时显隐</span><div class="forbidden-mini">iam:user:{view,add,edit,delete}</div></div>
          <div class="wb-card"><b>角色管理 · 按码裁剪</b><span>role 页同样演示按钮级 v-can</span><div class="forbidden-mini">iam:role:{view,add,edit,delete,batch_assign}</div></div>
          <div class="wb-card"><b>403 原地页</b><span>直输无码 URL → 守卫拦截 → 原地提示，不跳登录页</span><div class="forbidden-mini">BIZ-auth-003 · 路由守卫 ③</div></div>
        </div>
      </section>`;

    VIEW_RENDER.users = () => {
      const canAdd = has('iam:user:add'), canEdit = has('iam:user:edit'), canDel = has('iam:user:delete');

    function roleHint() {
      return `<div class="readonly-banner" style="margin-bottom:0;"><span class="ico">◈</span>
        当前角色上下文：<b>${ROLE_META[currentRole].label}</b> · ${ROLE_META[currentRole].desc} · 模拟持有 <code class="mono" style="font-size:12px;">${ROLE_CODES[currentRole].length}</code> 个能力码（实际来自 profile.permissions）
        <button class="btn btn-sm btn-outline" style="margin-left:auto;" onclick="document.querySelector('.role-switch')?.scrollIntoView({behavior:'smooth',block:'center'})">切角色看效果</button></div>`;
    }

    // ---- 总渲染 ----
    function renderAll() {
      renderRoleSwitch();
      renderSidebar();
      if (currentView === '403') {
        // 角色切换后 403 页是否依然成立？（重新核对所需码）
        const menu = MENUS.find((m) => m.label === $('crumb-current').textContent.replace('403 · 无权访问 · ', ''));
        if (menu && has(menu.code)) { navTo('workbench'); return; }
        const fmenu = MENUS.find((m) => !m.code ? false : $('main-area').textContent.includes(m.code));
        if (fmenu && has(fmenu.code)) { navTo('workbench'); return; }
        $('main-area').innerHTML = renderForbidden(MENUS.find((m) => $('main-area').textContent.includes(m.code)));
        renderSidebar();
        return;
      }
      if (VIEW_RENDER[currentView]) { $('main-area').innerHTML = VIEW_RENDER[currentView](); renderSidebar(); }
    }

    // ---- 主题切换（与原型导航同款：localStorage 持久化）----
    const rootEl = document.documentElement;
    const savedTheme = localStorage.getItem('hc-proto-theme');
    if (savedTheme === 'light') rootEl.classList.add('light');
    $('theme-toggle').onclick = () => {
      rootEl.classList.toggle('light');
      localStorage.setItem('hc-proto-theme', rootEl.classList.contains('light') ? 'light' : 'dark');
    };

    // ---- 启动 ----
    renderAll();
  </script>
</body>
</html>
