<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页 — WatchAlert 子项目并入</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <!-- 组件 1：eiam 统一登录入口（原本地账密登录页改造；本地账密表单已完全移除） -->
  <main class="login-card card" id="main-content">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <h3>WatchAlert</h3>
      <p class="muted-text">运维告警平台</p>
    </div>

    <div class="card-content">
      <!-- 错误提示（登录失败 / 配置缺失 两态复用，文案不同） -->
      <div class="login-alert" id="alert-error" role="alert" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span id="alert-text">登录失败，请重试</span>
      </div>

      <!-- 主按钮：使用平台账号登录 -->
      <button class="btn btn-primary btn-block" id="login-btn" aria-busy="false">
        <span class="spinner" id="spinner" aria-hidden="true" hidden></span>
        <span id="btn-label">使用平台账号登录</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
      </button>

      <!-- 重试按钮（登录失败态） -->
      <button class="btn btn-outline btn-block" id="retry-btn" hidden>重试</button>

      <p class="muted-text" style="text-align:center;">请使用运维平台统一账号（eiam）登录</p>
    </div>
  </main>

  <!-- 原型状态切换（非产品 UI） -->
  <div class="demo-controls">
    <span class="demo-label">登录页状态：</span>
    <button class="demo-btn" data-setview="default">未登录</button>
    <button class="demo-btn" data-setview="loading">跳转中</button>
    <button class="demo-btn" data-setview="error">登录失败</button>
    <button class="demo-btn" data-setview="config">配置缺失</button>
    <span class="demo-spacer"></span>
    <a class="link-plain" href="index.html">返回导航</a>
  </div>

  <script src="app.js"></script>
  <script>
    // 页面级状态组合（组件 1）
    var btn = document.getElementById('login-btn');
    var spinner = document.getElementById('spinner');
    var label = document.getElementById('btn-label');
    var alertBox = document.getElementById('alert-error');
    var alertText = document.getElementById('alert-text');
    var retry = document.getElementById('retry-btn');

    function apply(key) {
      // 复位
      btn.disabled = false;
      btn.setAttribute('aria-disabled', 'false');
      btn.removeAttribute('tabindex');
      btn.setAttribute('aria-busy', 'false');
      spinner.hidden = true;
      alertBox.hidden = true;
      retry.hidden = true;
      label.textContent = '使用平台账号登录';

      if (key === 'loading') {
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
        btn.setAttribute('aria-busy', 'true');
        spinner.hidden = false;
        label.textContent = '正在跳转安全登录…';
      } else if (key === 'error') {
        alertBox.hidden = false;
        alertText.textContent = '登录失败，请重试';
        retry.hidden = false;
      } else if (key === 'config') {
        btn.disabled = true;
        btn.setAttribute('aria-disabled', 'true');
        btn.setAttribute('tabindex', '-1');
        alertBox.hidden = false;
        alertText.textContent = '登录服务未配置，请联系管理员';
      }
      // default：保持复位态（主按钮 + 引导文案）
    }

    HavenProto.initDemoSwitcher(apply);
  </script>
</body>
</html>
