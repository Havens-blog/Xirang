#当需要对同一端口监听多个域名时，使用如下配置，端口相同域名不同，server_name也可以使用正则进行配置
#但要注意server过多需要手动扩大server_names_hash_bucket_size缓存区大小
server {
　　listen 80;
　　server_name houyi-cmdb.jlcops.com;
　　location / {
　　　　proxy_pass http://localhost:8000;
　　　　}
    location /api {
　　　　proxy_pass http://localhost:8300;
　　　　}
　　}
    access_log logs/houyi-cmdb.jlcops.com_http_access.log main;
	error_log  logs/houyi-cmdb.jlcops.com_http_error.log;
}