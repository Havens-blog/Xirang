
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  102400;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # WebSocket 升级映射(供 vhost 内 HMR / ws 反向代理使用)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # /console 静态缓存策略（任务 2.10 haven-console.conf）：content-hash 产物长缓存 immutable，
    # index.html 与 SPA 回退每次协商 revalidate
    map $uri $console_cache_control {
        ~*\.(js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$  "public, max-age=31536000, immutable";
        default                                                       "no-cache";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
	#给请求头中添加客户请求主机名
	proxy_set_header Host $host;
	#给请求头中添加客户端IP
	proxy_set_header X-Real-IP $remote_addr;
	#将$remote_addr变量值添加在客户端“X-Forwarded-For”请求头的后面，并以逗号分隔。 如果客户端请求未携带“X-Forwarded-For”请求头，$proxy_add_x_forwarded_for变量值将与$remote_addr变量相同  
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	#给请求头中添加客户端的Cookie
	proxy_set_header Cookie $http_cookie;
	#将使用代理服务器的主域名和端口号来替换。如果端口是80，可以不加。
	proxy_redirect off;

    include vhost/*.conf;

}
