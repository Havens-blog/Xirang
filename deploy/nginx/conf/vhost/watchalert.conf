# WatchAlert 告警平台 —— 方案 A 反代接入(olden 源码零改动)
#  前端(dev) : 127.0.0.1:3001  (D:\WatchAlert-web, react-scripts)
#  后端      : 127.0.0.1:9001  (D:\WatchAlert, Gin)
#  开发入口  : http://localhost:8891
#  前端 http.jsx 的 axios baseURL 取当前 window.location 的 host:port,
#  所以浏览器访问 8891 时 /api 自然落到本 vhost, 再由下方 location 转发到 9001。

server {
    listen       8891;
    server_name  localhost;

    # ---- 后端 API (优先于前端 dev server 自带 proxy, 生产/开发统一走这里) ----
    location /api/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # ---- 前端:开发态反代到 react dev server; 生产态换成下面注释里的静态目录 ----
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        # HMR websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- 生产态:前端构建产物由 nginx 直接serve (把上面 location / 替换为如下) ----
    # location / {
    #     root   D:/WatchAlert-web/build;
    #     index  index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    access_log logs/watchalert_http_access.log main;
    error_log  logs/watchalert_http_error.log;
}

