server {
    listen        8086;
    server_name  www.jlcops.com;
        
		
		location /api/auth {
			fastcgi_intercept_errors on;
			proxy_pass_request_body  off;
			if ($request_method = 'OPTIONS') {
			    return 204;
			}
			proxy_set_header X-Original-URI $request_uri;
			proxy_set_header X-Original-METHOD $request_method;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://127.0.0.1:18080/auth;
		}
		
		location /ums {
			auth_request /api/auth;
			auth_request_set $user $upstream_http_x_user;
			auth_request_set $error $upstream_http_x_error;
			auth_request_set $error_code $upstream_http_x_error_code;
			proxy_set_header X-Error $error;
			proxy_set_header X-User $user;
			error_page 400 401 403 404 501 500 502 503 504 = @error;
			
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header REMOTE-HOST $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		  proxy_pass http://127.0.0.1:18080;
		}
		
		location /service {
			auth_request /api/auth;
			auth_request_set $user $upstream_http_x_user;
			error_page 400 401 403 404 501 500 502 503 504 = @error;
			proxy_set_header X-User $user;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header REMOTE-HOST $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		  proxy_pass http://127.0.0.1:18081;
		}
		
		location /configure {
			auth_request /api/auth;
			auth_request_set $user $upstream_http_x_user;
			error_page 400 401 403 404 501 500 502 503 504 = @error;
			proxy_set_header X-User $user;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header REMOTE-HOST $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		  proxy_pass http://127.0.0.1:18082;
		}

		location @error{
			add_header Access-Control-Allow-Origin *;
			add_header Content-Type application/json;
			if ($error){
				return 200 '{"code":$error_code,"msg":"$error"}';
			}
			return 200 '{"code":400,"msg":"系统内部错误"}';
		}
		access_log logs/www.jlcops.com_http_access.log main;
		error_log  logs/www.jlcops.com_http_error.log;
}