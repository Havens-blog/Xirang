server {
        listen 8888;
        server_name localhost;

        # eiam 统一身份服务: /api/iam/* -> eiam /api/*
        # 注意：登录/切换租户的响应携带大体积 Set-Cookie（JWT 内含授权声明，
        # 4KB+），默认 proxy_buffer_size 装不下会报 "upstream sent too big header" 502
        location ^~ /api/iam/ {
            proxy_pass http://127.0.0.1:9000/api/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Active-Tenant-ID $http_x_active_tenant_id;
            proxy_buffer_size 32k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
        }

		location ^~ /api/v1/cmdb/ {
            proxy_pass http://127.0.0.1:8001/api/v1/cmdb/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
        }

        # e-cam-service API: /api/cam/* -> e-cam-service /api/v1/cam/*
        location ^~ /api/v1/cam/ {
            proxy_pass http://127.0.0.1:8001/api/v1/cam/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            # 联邦查询(31 云账号)常超 60s 默认值;放宽读/发送超时避免 502/504
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 注意：location 不带尾斜杠。前端请求 /api/v1/certs（无斜杠），
        # 若写成 ^~ /api/v1/certs/ 会匹配不上，落到下面 location / 被转发到前端 dev server。
        # proxy_pass 不带 URI 部分，原始路径原样透传到后端。
        location ^~ /api/v1/certs {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
        }

        # opsagent 编排层 API: /api/v1/opsagent/* -> opsagent :8081
        location ^~ /api/v1/opsagent/ {
            proxy_pass http://127.0.0.1:8081/api/v1/opsagent/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Active-Tenant-ID $http_x_active_tenant_id;
        }

        # e-cam-web 前端 (vite dev server)
        location ^~ /cam/ {
            proxy_pass http://127.0.0.1:5173/cam/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── /console/* 控制台静态托管（任务 2.10 haven-console.conf 同域形态；
        #    验收宿主硬规则：必为 nginx 同域形态，禁止 vite dev server 判定通过）──
        # 回切开关 ①：注释行切换静态池 + `nginx -s reload`（秒级，无 rebuild）。
        location = /console {
            return 301 /console/;
        }
        location ^~ /console/ {
            alias D:/Haven/haven-console/dist/;
            index index.html;
            try_files $uri $uri/ /console/index.html;
            gzip_static on;
            add_header Vary "Accept-Encoding" always;
            # CSP 基线（tech-design §Security；style-src 'unsafe-inline' 为 Element Plus 弹层所需，5.6 实测收敛）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control $console_cache_control always;
        }

        # ── /opsagent/* 运维 Agent 独立前端静态托管（6.2 opsagent-web 独立仓库同域形态；
        #    与 /console/ haven-console、/cam/ e-cam-web 并列；API 走上方 /api/v1/opsagent/ 块）──
        location = /opsagent {
            return 301 /opsagent/;
        }
        location ^~ /opsagent/ {
            alias D:/Haven/opsagent-web/dist/;
            index index.html;
            try_files $uri $uri/ /opsagent/index.html;
            gzip_static on;
            add_header Vary "Accept-Encoding" always;
            # 安全基线（与 /console/ 同口径；style-src 'unsafe-inline' 为 Element Plus 弹层所需）
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control $console_cache_control always;
        }

        # ── WatchAlert 告警平台（子项目，eiam 共享会话）──
        # 后端 API: /api/w8t/* /api/system/* /api/watchalert/* /api/oidc/* -> 9001
        location ^~ /api/w8t/ {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }
        location ^~ /api/system/ {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }
        location ^~ /api/watchalert/ {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }
        location ^~ /api/oidc/ {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Requested-With $http_x_requested_with;
        }
        # eiam 单点登出: WatchAlert 前端直接调 /api/user/logout -> eiam 9000
        location ^~ /api/user/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # ── /watchalert/* 告警平台前端静态托管（子项目，同域形态）──
        location = /watchalert {
            return 301 /watchalert/;
        }
        location ^~ /watchalert/ {
            alias D:/Haven/watch-alert-web/build/;
            index index.html;
            try_files $uri $uri/ /watchalert/index.html;
            gzip_static on;
            add_header Vary "Accept-Encoding" always;
        }

        # 根入口 301 -> /console/（haven-console 统一入口，移除已废弃的 ecmdb-web 前端）
        location / {
            return 301 /console/;
        }
		access_log logs/dev_http_access.log main;
		error_log  logs/dev_http_error.log;
    }