name: Publish eiam

# 迁自模块原 .github/workflows/docker-publish.yml（单仓化后嵌套工作流惰性，搬至根级）
# 触发：services/eiam 变更推 main / eiam 版本标签 / 每晚定时 / 手动；PR 仅构建不推送。
# 依赖 secrets：ALIYUN_REGISTRY_USER / ALIYUN_REGISTRY_PASSWORD（registry.cn-qingdao.aliyuncs.com）

on:
  schedule:
    - cron: '32 20 * * *'
  push:
    branches: [main]
    paths:
      - 'services/eiam/**'
    tags: ['eiam/v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - 'services/eiam/**'
  workflow_dispatch:

env:
  REGISTRY: registry.cn-qingdao.aliyuncs.com
  TAGS: duke1616/eiam

# 同分支后续推送取消前序运行，避免重复打镜像
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Latest Tags
        id: octokit
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Havens-blog/Xirang
          prefix: eiam/v
          releases-only: false

      # 单仓标签带 eiam/ 命名空间；VERSION 剥离前缀还原 vX.Y.Z 语义
      - name: 版本号归一
        id: version
        shell: bash
        run: |
          tag="${{ steps.octokit.outputs.tag }}"
          echo "value=${tag#eiam/}" >> "$GITHUB_OUTPUT"

      # 镜像标签确定性计算（命名空间标签经 sanitize 不可控，直接算）
      - name: 计算镜像标签
        id: tags
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#eiam/}"
            echo "value=${{ env.REGISTRY }}/${{ env.TAGS }}:${v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.REGISTRY }}/${{ env.TAGS }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Secrets 预检
        id: precheck
        shell: bash
        run: |
          if [ -n "${{ secrets.ALIYUN_REGISTRY_USER }}" ] && [ -n "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Xirang 尚未配置 ALIYUN_REGISTRY_USER/PASSWORD，本次仅构建不推送，配置后自动生效"
          fi

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login into registry
        if: github.event_name != 'pull_request' && steps.precheck.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: services/eiam
          file: services/eiam/deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.precheck.outputs.ready == 'true' }}
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}