name: Services CI (Go)

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'go.work'
      - '.github/workflows/services-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'go.work'
      - '.github/workflows/services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # eiam 最新行要求 go>=1.26（toolchain go1.26.9，GOTOOLCHAIN=auto 会自动取用）
  GO_VERSION: '1.26.x'

jobs:
  # ── eiam ──────────────────────────────────────────────────────────
  # AGENTS.md 约定：go.test 竞态检测；单测严禁直连外部资源。
  # internal/test/integration 为真集成套件（需外部 DB/配置），CI 排除，本地真实配置环境运行。
  eiam:
    name: Test eiam
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/eiam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            services/eiam/go.sum
            services/e-cam-service/go.sum
            services/opsagent/go.sum
            go.work

      - name: go vet
        run: go vet ./...

      - name: go test -race（单元；集成套件需要真实基础设施，CI 排除）
        shell: bash
        run: |
          pkg_list=$(go list ./... | grep -v '/internal/test/integration')
          echo "测试包：$pkg_list"
          go test -race $pkg_list

      - name: go build
        run: go build ./...

  # ── e-cam-service ─────────────────────────────────────────────────
  # 迁自模块原 ci.yml：mongo + redis 服务容器；去掉 codecov/golangci（后续单列质量门禁）。
  ecam-service:
    name: Test e-cam-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/e-cam-service
    services:
      # 无鉴权容器：DAO 测试以无凭据 URI 连接（change_order_audit_test.go 等，
      # 带 root env 的官方镜像开鉴权会 Unauthorized createIndexes）
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            services/eiam/go.sum
            services/e-cam-service/go.sum
            services/opsagent/go.sum
            go.work

      - name: go mod download
        run: go mod download

      # -skip：live-probe 手动探索测试（waf/拓扑缓存探测等）读 config/prod.yaml 的
      # 占位 DSN 直连真实网络（20~30s 超时失败）；CI 无真实凭据，按测试自身
      # 「读不到配置即 skip」的设计意图在门禁侧精确跳过，本地带凭据仍可跑
      # -race：竞态检测已恢复（cost/analysis 三处测试夹具竞态已修复：
      # TestGetCostSummary_Cache/DateRanges、TestProperty14_FilterCorrectness）
      - name: go test（需 mongo+redis 容器；-race）
        run: |
          go test -race -coverprofile=coverage.out \
            -skip '^(TestProbeAWSWAFInstances|TestLiveAWSWAFResolved|TestProbeLiveBuildWAFtoALB|TestProbeTencentWAFSourceInDB|TestProbeTopoCache)$' \
            ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # ── opsagent ──────────────────────────────────────────────────────
  opsagent:
    name: Test opsagent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/opsagent
    services:
      # 无鉴权容器：opsagent DAO 测试默认连 mongodb://localhost:27017（无凭据，见 alert_test.go）
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            services/eiam/go.sum
            services/e-cam-service/go.sum
            services/opsagent/go.sum
            go.work

      - name: go vet
        run: go vet ./...

      # DAO 集成测试采取硬门控（缺 Mongo 报错而非跳过，见 opsagent 7fe9 系列提交），
      # 因此本 job 提供 mongodb 服务容器，真实跑 alert/citation/compensation 等 DAO 覆盖
      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...