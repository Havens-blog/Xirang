name: Console & Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/haven-console/**'
      - 'apps/e-cam-web/**'
      - 'apps/opsagent-web/**'
      - '.github/workflows/console-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/haven-console/**'
      - 'apps/e-cam-web/**'
      - 'apps/opsagent-web/**'
      - '.github/workflows/console-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 控制台 AC1: typecheck + build:gz（迁自模块原 ci.yml，路径下沉 apps/haven-console）──
  typecheck-build:
    name: Console Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/haven-console/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/haven-console
        run: pnpm install --frozen-lockfile

      - name: Typecheck (vue-tsc)
        working-directory: apps/haven-console
        run: pnpm typecheck

      - name: Build + 生成 .gz（构建期预生成，供 nginx gzip_static）
        working-directory: apps/haven-console
        run: pnpm build:gz

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: apps/haven-console/dist/
          retention-days: 7

  # ── 控制台 AC1: vitest（失败自动上报 annotation + STEP_SUMMARY）──
  vitest:
    name: Console Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/haven-console/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/haven-console
        run: pnpm install --frozen-lockfile

      - name: Vitest
        working-directory: apps/haven-console
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml 2>&1 | tee vitest.log
          exit_code=${PIPESTATUS[0]}
          {
            echo '## Vitest 输出尾部（120 行）'
            echo '```'
            tail -n 120 vitest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $exit_code -ne 0 ]; then
            node scripts/report-vitest-failures.mjs vitest-junit.xml
          fi
          exit $exit_code

      - name: Upload vitest report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-vitest-report
          path: |
            apps/haven-console/vitest-junit.xml
            apps/haven-console/vitest.log
          retention-days: 7

  # ── 控制台 AC2: gzip 预算闸门（Hard Rule）──
  gzip-budget:
    name: Console Gzip Budget (≤300KB)
    needs: typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: apps/haven-console/dist

      - name: Gzip 预算检查（Hard Rule：超限必须 fail）
        run: node apps/haven-console/scripts/gzip-budget.mjs apps/haven-console/dist

  # ── 控制台 AC3/AC4: 拷贝面漂移对比（单仓内 apps/e-cam-web 就地取材）──
  drift-compare:
    name: Console Drift Compare (e-cam-web sha256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 漂移比对（e-cam-web 源文件重算 sha256 vs shared-hashes.json）
        env:
          E_CAM_WEB_ROOT: ${{ github.workspace }}/apps/e-cam-web
        run: node apps/haven-console/scripts/drift-check.mjs apps/haven-console/shared-hashes.json "$E_CAM_WEB_ROOT"

  # ── 前端矩阵：e-cam-web / opsagent-web 构建门禁 ──
  webapps-build:
    name: Web App Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [e-cam-web, opsagent-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/${{ matrix.app }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck (vue-tsc)
        working-directory: apps/${{ matrix.app }}
        run: pnpm typecheck

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: pnpm build