name: Repo Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene Gate (垃圾目录/二进制/大文件零容忍)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 仓库卫生检查（Hard Rule）
        run: node scripts/repo-hygiene.mjs