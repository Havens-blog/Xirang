# opsagent 默认配置（本地开发）。
# 敏感项优先级：环境变量 > 本文件。
#   OPSAGENT_ALERT_WEBHOOK_KEY    → notify.alert_webhook_key
#   OPSAGENT_LLM_API_KEY          → llm.api_key
#   OPSAGENT_REDIS_PASSWORD       → redis.password
#   OPSAGENT_SESSION_ENCRYPTED_KEY → session.encrypted_key
#
# session（redis.db / encrypted_key / cookie）必须与 eiam 写入会话的配置一致，
# 否则所有请求将因「会话无效」返回 401 ERR_TENANT_DENIED。

server:
  port: 8081
  read_timeout_seconds: 30   # 与编排侧 25s 同步预算对齐（tech-design）
  write_timeout_seconds: 30

mongo:
  uri: "mongodb://127.0.0.1:27017"   # 本地 dev mongod（与 e-cam-service 脚本/DAO 集成测试同源；远端 106.52.187.69:27017 需认证凭据）
  dbname: "opsagent"

base:
  logquery_base_url: "http://localhost:8001"   # e-cam-service（契约 B1 日志联邦）
  mcp_server_path: ""                           # 资产查询 mcp-server（契约 B2，stdio；未配置则资产查询降级）

redis:
  addr: "106.52.187.69:6379"   # 与 eiam/config.yaml 会话存储一致（远端共享 Redis）
  password: "1234567890"       # 必须与 eiam/config.yaml redis.password 一致，否则读不到 eiam 签发会话（恒 401）
  db: 1                      # 必须与 eiam 会话 DB 一致

# 与 eiam/config.yaml 的 session_encrypted_key 完全一致，否则解不开 eiam 签发的 token（恒 401）。
session:
  encrypted_key: "haven-dev-session-shared-key-2026-10-10-A"
  cookie_name: "ecmdb-token-key"   # 与 eiam/e-cam-service 同名（eiam 签发的会话 cookie，浏览器兜底载体）
  cookie_domain: "localhost"
  whitelist:                 # 跳过用户会话鉴权的路径（精确或 /path/* 前缀）
    - /api/v1/opsagent/health
    - /api/v1/opsagent/alerts   # 告警入站 webhook（服务间密钥鉴权，后续任务接入）

llm:
  provider: qwen             # qwen | deepseek | openai
  model: qwen-plus
  api_key: ""                # 生产环境用 OPSAGENT_LLM_API_KEY 注入；为空走降级路径
  base_url: ""
  timeout_seconds: 12        # >12s 触发降级谓词
  budget_per_hour: 100       # 滚动 1h LLM 调用预算

notify:
  alert_webhook_key: "dev-opsagent-alert-webhook-key"   # 服务间密钥，生产环境用 env 注入
  max_attempts: 3
  channels:
    - channel: dingtalk
      enabled: false
      webhook: ""
    - channel: feishu
      enabled: false
      webhook: ""
    - channel: wecom
      enabled: false
      webhook: ""
    - channel: email
      enabled: false
      webhook: ""

thresholds:
  worker_concurrency: 5      # 告警排查并发上限（P1 单实例约束）
  queue_capacity: 100        # 告警队列容量，溢出丢弃低级别保留高危
  dedup_window_minutes: 10   # 指纹去重窗口
  max_timeframe_hours: 24    # 查询时间窗上限
  clarify_confidence: 0.6    # 意图置信度低于该值触发澄清

whitelist:                   # 低危白名单（运行时须命中 internal/risk 注册表）
  entries: []
