<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudNexus - 资源拓扑</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg0:#0a0e1a;--bg1:#111827;--bg2:#1a2236;--bg3:#1f2a42;
--bd:rgba(255,255,255,.06);--bda:rgba(99,102,241,.5);
--c1:#f1f5f9;--c2:#94a3b8;--c3:#64748b;
--ac:#6366f1;--acl:#818cf8;
--ok:#10b981;--wn:#f59e0b;--ng:#ef4444;--inf:#3b82f6;
--ali:#ff6a00;--aws:#ff9900;--tc:#00a4ff;--hw:#cf0a2c;--vc:#3370ff;
--cc:#818cf8;--cn:#38bdf8;--cd:#34d399;--cs:#fbbf24;--cm:#f472b6;--cx:#f87171
}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg0);color:var(--c1);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
#app{display:flex;height:100vh}
</style>
</head>
<body>
<div id="app"></div>
</body>
</html>
